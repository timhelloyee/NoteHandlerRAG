<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteHandlerRAG</title>
  <style>
    /* Every value the UI editor at /ui-editor can change lives in this block, and
       nowhere else. Keeping them here is what makes the editor's write-back safe: it
       rewrites exactly this :root rule and never touches the rest of the file. */
    :root {
      --card: #ffffff;
      --ink: #1f2430;
      --muted: #6b7280;
      --border: #e6e8ef;
      --accent: #4f46e5;
      --accent-2: #4c80f0;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
      --page-width: 780px;
      --bg-top: #e9eefb;
      --bg-body: #f6f8fc;
      --font-size: 16px;
      --line-height: 1.6;
      --font-family: system-ui, "Segoe UI", "Noto Sans TC", sans-serif;
      --font-heading: system-ui, "Segoe UI", "Noto Sans TC", sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", Consolas, "Noto Sans Mono", monospace;
      font-family: var(--font-family);
      font-size: var(--font-size);
    }
    /* Derived from the editable tokens above, so a colour changed in /ui-editor carries
       through to every tint, outline and focus ring instead of leaving stale hex behind. */
    html {
      --accent-soft: color-mix(in srgb, var(--accent) 9%, var(--card));
      --accent-line: color-mix(in srgb, var(--accent) 30%, var(--card));
      --accent-press: color-mix(in srgb, var(--accent) 86%, #000);
      --danger-line: color-mix(in srgb, var(--danger) 32%, var(--card));
      --field: color-mix(in srgb, var(--bg-body) 45%, var(--card));
      --well: color-mix(in srgb, var(--bg-body) 80%, var(--card));
      --focus: color-mix(in srgb, var(--accent-2) 30%, transparent);
      accent-color: var(--accent);
      caret-color: var(--accent);
      scrollbar-color: color-mix(in srgb, var(--muted) 45%, transparent) transparent;
    }
    ::selection { background: color-mix(in srgb, var(--accent) 22%, transparent); }
    ::placeholder { color: var(--muted); opacity: 1; }
    :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
    a { color: var(--accent); text-underline-offset: .18em; }
    * { box-sizing: border-box; }
    body {
      max-width: var(--page-width); margin: 0 auto; padding: 2.5rem 1.25rem 4rem;
      color: var(--ink); line-height: var(--line-height); min-height: 100vh;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-body) 260px, var(--bg-body) 100%);
    }

    /* Header */
    .app-header { text-align: center; margin-bottom: 2rem; }
    .app-header h1 {
      font-family: var(--font-heading);
      font-size: 2.1rem; margin: 0 0 .35rem; font-weight: 800; letter-spacing: -.02em;
      display: inline-flex; align-items: center; gap: .55rem; color: var(--ink);
    }
    .app-header .mark { color: var(--accent); flex: none; }
    .tagline { color: color-mix(in srgb, var(--muted) 65%, var(--ink)); margin: 0; font-size: .95rem; }

    /* Cloud-sync banner: why notes are missing, or that a change has not been saved. */
    .banner {
      margin: 0 0 1.25rem; padding: .75rem 1rem; border-radius: 10px;
      border: 1px solid var(--border); font-size: .92rem; line-height: 1.6;
    }
    .banner.error { background: #fdecea; border-color: #f3b8b1; color: #8a1c12; }
    .banner.warn  { background: #fdf3dc; border-color: #f0d49a; color: #7a4a05; }
    .banner.info  { background: var(--card); color: var(--muted); }

    /* Cards */
    section {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.3rem 1.4rem; margin-bottom: 1.25rem; box-shadow: var(--shadow);
    }
    label { font-weight: 600; display: block; margin-bottom: .45rem; font-size: .9rem; }
    /* What a card is about, as opposed to the fields inside it. */
    .title { font-size: 1.05rem; font-weight: 700; margin: 0 0 .6rem; display: block; }

    /* Inputs */
    input, textarea, button, select { font: inherit; }
    select {
      padding: .5rem .7rem; border: 1px solid var(--border); border-radius: 10px;
      background: var(--field); color: var(--ink); cursor: pointer; max-width: 100%;
    }
    select:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--focus); }
    .model-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-top: .8rem; }
    .model-row label { margin: 0; white-space: nowrap; }
    input[type=text], textarea {
      width: 100%; padding: .65rem .8rem; border: 1px solid var(--border); border-radius: 10px;
      background: var(--field); color: var(--ink); transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus, textarea:focus {
      outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--focus);
    }
    textarea { min-height: 90px; resize: vertical; }
    input[type=file] {
      width: 100%; padding: .55rem; border: 1px dashed var(--border); border-radius: 10px;
      background: var(--field); color: var(--ink); cursor: pointer;
    }
    input[type=file]::file-selector-button {
      margin-right: .8rem; padding: .4rem .8rem; border: 0; border-radius: 8px;
      background: var(--accent-soft); color: var(--accent); font-weight: 600; cursor: pointer;
    }

    /* Buttons */
    button {
      margin-top: .6rem; padding: .6rem 1.2rem; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff;
      font-weight: 600; cursor: pointer;
      transition: background-color .15s, border-color .15s, color .15s, transform .08s;
    }
    button:hover { background: var(--accent-press); }
    button:active { transform: translateY(1px); }
    /* One rule for every button and picker, so a locked control never looks live. */
    button:disabled, select:disabled { opacity: .5; pointer-events: none; }
    #refreshBtn { background: var(--accent-soft); color: var(--accent); }
    #refreshBtn:hover { background: color-mix(in srgb, var(--accent) 16%, var(--card)); }

    /* Answer */
    #answer {
      background: var(--well); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.1rem; margin-top: .75rem; min-height: 1rem; overflow-x: auto;
    }
    #answer:empty { display: none; }
    /* Waiting and failing must not look like an answer. */
    #answer.pending { color: var(--muted); animation: pending 1.4s ease-in-out infinite; }
    #answer.error { background: #fdecea; border-color: #f3b8b1; color: #8a1c12; }
    @keyframes pending { 50% { opacity: .45; } }
    #answer p { margin: .5rem 0; }
    #answer ul, #answer ol { margin: .5rem 0; padding-left: 1.4rem; }
    #answer li { margin: .15rem 0; }
    #answer p:first-child, #answer h1:first-child, #answer h2:first-child, #answer h3:first-child, #answer ul:first-child, #answer ol:first-child { margin-top: 0; }
    #answer p:last-child, #answer ul:last-child, #answer ol:last-child { margin-bottom: 0; }
    #answer pre { background: var(--border); padding: .6rem; border-radius: 8px; overflow-x: auto; }
    #answer code, #answer pre, .preview code, .preview pre, .full code, .full pre {
      font-family: var(--font-mono);
    }
    #answer code { background: var(--border); padding: .1rem .3rem; border-radius: 4px; }
    #answer pre code { background: none; padding: 0; }
    /* Sources: each citation in the answer opens the note it came from, at that page. */
    button.cite {
      margin: 0 .1rem; padding: 0 .45rem; font-size: .75rem; font-weight: 600; line-height: 1.6;
      vertical-align: baseline; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line);
    }
    button.cite:hover { background: var(--accent); color: #fff; }
    .sources { margin: .6rem 0 0; font-size: .85rem; color: var(--muted); display: flex;
               flex-wrap: wrap; align-items: center; gap: .3rem; }
    .sources .dropped { flex-basis: 100%; margin: .2rem 0 0; }

    .row { display: flex; gap: .5rem; align-items: end; }
    .muted { color: var(--muted); font-size: .85rem; }
    .divider { border: 0; border-top: 1px solid var(--border); margin: 1.4rem 0; }

    /* Notes list */
    ul { padding-left: 0; list-style: none; margin: .5rem 0 0; }
    #notes li {
      display: flex; justify-content: space-between; align-items: center; gap: .75rem;
      padding: .6rem .2rem; border-bottom: 1px solid var(--border);
    }
    #notes li:last-child { border-bottom: 0; }
    #notes li.muted { border-bottom: 0; justify-content: flex-start; }
    #notes .meta { word-break: break-word; font-size: .9rem; flex: 1; min-width: 12rem; }
    /* Name first, then two lines of what is inside: enough to recognise a note without
       the row growing to the height of the note itself. 展開更多 shows the rest. */
    .note-name { font-weight: 600; }
    .note-type {
      font-size: .7rem; font-weight: 600; color: var(--muted); letter-spacing: .02em;
      border: 1px solid var(--border); border-radius: 5px; padding: 0 .35rem;
      margin-right: .4rem; vertical-align: .08em; white-space: nowrap;
    }
    .note-preview {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2;
      overflow: hidden; color: var(--muted); font-size: .85rem; margin-top: .1rem;
    }
    button.del {
      margin-top: 0; padding: .35rem .75rem; font-size: .8rem; flex: none;
      background: var(--card); color: var(--danger); border: 1px solid var(--danger-line);
    }
    button.del:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    button.edit {
      margin-top: 0; padding: .35rem .75rem; font-size: .8rem; flex: none;
      background: var(--card); color: var(--accent); border: 1px solid var(--accent-line);
    }
    button.edit:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    #notes li { flex-wrap: wrap; }
    .note-actions { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
    /* Every control in a row is the same height, whichever class it borrowed. */
    .note-actions .toggle, .note-actions select.move { padding: .35rem .65rem; font-size: .8rem; }
    .note-actions > * { min-height: 2.1rem; }
    /* Editor: the original on the left, what the model read on the right. Seeing them
       together is the only way a user finds out the transcription is wrong. */
    .editor { flex-basis: 100%; margin-top: .6rem; }
    .editor.split { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; align-items: start; }
    .editor textarea { min-height: 420px; font-size: .9rem; line-height: 1.5; }
    .editor .hint { margin: .35rem 0 0; }
    .editor .pane-label { font-size: .8rem; color: var(--muted); margin: 0 0 .3rem; }
    .original { min-width: 0; }
    .original img, .original iframe {
      width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
    }
    .original img { display: block; height: auto; }
    .original iframe { height: 420px; }
    /* Two stacked frames: the incoming page loads at opacity 0 behind the visible one
       and they swap when it is ready, so the pane never flashes blank mid-jump. */
    .pdfwrap { position: relative; height: 420px; }
    .pdfwrap iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; pointer-events: none;
    }
    .pdfwrap iframe.front { opacity: 1; pointer-events: auto; }
    .pages { display: flex; flex-wrap: wrap; gap: .25rem; margin: .4rem 0 0; }
    .pages button {
      margin-top: 0; padding: .2rem .5rem; font-size: .75rem; flex: none;
      background: var(--card); color: var(--accent); border: 1px solid var(--accent-line);
      font-variant-numeric: tabular-nums;
    }
    .pages button:hover { background: var(--accent-soft); }
    .pages button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    /* Live preview: the stored text is Markdown + LaTeX, which a student should not have
       to read in order to fix a wrong digit. Showing the rendered result as they type
       means the source box is only ever a means to an end. */
    .preview-bar { display: flex; align-items: center; gap: .5rem; margin: .5rem 0 .3rem; }
    .preview-bar .pane-label { margin: 0; }
    .preview {
      border: 1px solid var(--border); border-radius: 8px; padding: .6rem .8rem;
      background: var(--well); font-size: .9rem; line-height: 1.6; max-height: 300px;
      overflow: auto; word-break: break-word;
    }
    .preview :first-child { margin-top: 0; }
    .preview :last-child { margin-bottom: 0; }
    .preview table { border-collapse: collapse; }
    .preview th, .preview td { border: 1px solid var(--border); padding: .2rem .45rem; }
    .toggle {
      margin-top: 0; padding: .2rem .55rem; font-size: .75rem; flex: none;
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
    }
    .toggle:hover { background: var(--border); color: var(--ink); }
    /* Expanded full note text under a list row */
    .full {
      flex-basis: 100%; margin: .5rem 0 0; border: 1px solid var(--border);
      border-radius: 8px; padding: .6rem .8rem; background: var(--well);
      font-size: .85rem; line-height: 1.6; max-height: 340px; overflow: auto;
    }
    .full :first-child { margin-top: 0; }

    /* Categories: one group per category, each a drop target for dragged notes. */
    .cat-add { display: flex; gap: .5rem; align-items: center; margin: .2rem 0 1rem; }
    .cat-add input[type=text] { flex: 1; }
    .cat-add button { margin-top: 0; white-space: nowrap; }
    .cat-group {
      border-top: 1px solid var(--border); padding: .8rem .5rem .4rem; margin: 0 -.5rem;
      transition: background-color .12s;
    }
    .cat-group.drop {
      background: var(--accent-soft); border-radius: 10px;
      outline: 2px dashed var(--accent-line); outline-offset: -2px;
    }
    .cat-head { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .cat-name { font-weight: 700; }
    .cat-group.none .cat-name { color: var(--muted); font-weight: 600; }
    .cat-count {
      font-size: .75rem; color: var(--muted); background: var(--well);
      border-radius: 999px; padding: 0 .5rem; font-variant-numeric: tabular-nums;
    }
    .cat-tools { margin-left: auto; display: flex; gap: .3rem; }
    .cat-tools .danger { color: var(--danger); }
    .cat-notes { margin-top: .2rem; }
    .cat-notes .empty { color: var(--muted); font-size: .85rem; padding: .5rem .2rem; border-bottom: 0; }
    .grip {
      cursor: grab; color: var(--muted); padding: .45rem .5rem .45rem .15rem; user-select: none;
      display: inline-flex; border-radius: 6px;
    }
    .grip:hover { color: var(--ink); background: var(--well); }
    .grip:active { cursor: grabbing; }
    .grip[draggable=false] { cursor: default; opacity: .4; }
    #notes li.dragging { opacity: .45; }
    select.move { padding: .25rem .4rem; font-size: .8rem; border-radius: 8px; }
    #signoutLink { margin-left: .5rem; }
    @media (max-width: 720px) {
      .editor.split { grid-template-columns: 1fr; }
      .editor textarea { min-height: 260px; }
    }
    /* Fingers need more than a 26px target; a mouse does not. */
    @media (pointer: coarse) {
      .note-actions button, .cat-tools button, select.move, .pages button { min-height: 2.75rem; }
      .pages button { min-width: 2.75rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
  <script>
    // MathJax must be configured before its script loads.
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
      },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <header class="app-header">
    <h1><svg class="mark" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="15" height="18" rx="2.5"/><path d="M9 3v18M3 8h4M3 12h4M3 16h4M13 8h4M13 12h3"/></svg>NoteHandlerRAG</h1>
    <p class="tagline">多模態筆記檢索 · 文字、圖片與 PDF 智慧問答</p>
  </header>

  <div id="syncBanner" class="banner" role="status" hidden></div>

  <section>
    <h2 class="title">Google 帳號</h2>
    <div id="gsiButton"></div>
    <p id="googleStatus" class="muted">使用 Google 登入後，才能看到與管理你的筆記。
      <a id="signoutLink" href="#" style="display:none">登出</a></p>
  </section>

  <section>
    <label class="title" for="question">問問題</label>
    <textarea id="question" placeholder="輸入問題，例如：輸出每一個科目統整後的筆記內容"></textarea>
    <div class="model-row">
      <label for="askCategory">問題範圍</label>
      <select id="askCategory"><option value="">全部類別</option></select>
    </div>
    <p class="muted" id="askScopeHint">未選擇類別時，會在所有筆記中尋找答案。</p>
    <div class="model-row">
      <label for="model">AI 模型</label>
      <select id="model"></select>
    </div>
    <p class="muted">此模型用於回答問題，以及解析上傳的圖片／PDF。</p>
    <button id="askBtn">送出</button>
    <div id="answer" aria-live="polite"></div>
  </section>

  <section>
    <h2 class="title">筆記分類</h2>
    <p class="muted">只會顯示你登入的 Google 帳號所儲存的筆記。按住筆記左邊的拖曳把手，拖到其他類別即可移動；手機上可用「移到」選單。</p>
    <div class="cat-add">
      <input type="text" id="newCategory" maxlength="30" placeholder="新類別名稱，例如：生物">
      <button id="addCategoryBtn">新增類別</button>
    </div>
    <div id="notes"></div>
    <button id="refreshBtn">重新整理</button>

    <hr class="divider">
    <label class="title" for="file">上傳筆記 (.txt / .md / 圖片 / PDF)</label>
    <input type="file" id="file" accept=".txt,.md,.jpg,.jpeg,.png,.webp,.gif,.pdf">
    <div class="model-row">
      <label for="uploadCategory">放入類別</label>
      <select id="uploadCategory"><option value="">未分類</option></select>
    </div>
    <div><button id="uploadBtn">上傳</button></div>
    <div id="uploadResult" class="muted" role="status"></div>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);

    // Backend base URL: on GitHub Pages, point at the Hugging Face Space; otherwise
    // (served by FastAPI locally or on the Space itself) use same-origin relative paths.
    const API_BASE = location.hostname.endsWith("github.io")
      ? "https://timhelloyee-notehandler.hf.space"   // Hugging Face Space backend
      : "";

    // --- Signed-in state ---------------------------------------------------------
    // The Google ID token itself is what proves who you are; the server verifies it on
    // every request. The page used to send only the email it decoded, which the server
    // believed — so anyone who knew an address could open that person's notes.
    const TOKEN_KEY = "nh_token";
    let idToken = null;

    // Local development only: dev_server.py accepts X-Dev-User instead of a Google
    // sign-in. Never sent from any other host, and the deployed server ignores it.
    const IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
    const DEV_USER = IS_LOCAL ? localStorage.getItem("nh_dev_user") : null;

    function tokenClaims(token) {
      try { return token ? decodeJwt(token) : null; } catch (e) { return null; }
    }
    // Treat a token within a minute of expiry as already expired, so a request is not
    // sent with a token that dies on the way.
    function tokenUsable(token) {
      const c = tokenClaims(token);
      return !!(c && c.email && c.exp * 1000 > Date.now() + 60000);
    }
    // For display and "please sign in" checks only — never sent to the server.
    const userId = () => (idToken && tokenClaims(idToken)?.email) || DEV_USER || "";

    // Every per-user request goes through here so the credential is attached in one
    // place. A 401 means the token expired or was rejected: sign out visibly rather than
    // leaving a page that silently fails.
    async function api(path, opts = {}) {
      const headers = new Headers(opts.headers || {});
      if (idToken) headers.set("Authorization", "Bearer " + idToken);
      else if (DEV_USER) headers.set("X-Dev-User", DEV_USER);
      const res = await fetch(API_BASE + path, { ...opts, headers });
      if (res.status === 401 && idToken) signedOut("登入已過期，請重新登入。");
      return res;
    }

    // --- Cloud sync state --------------------------------------------------------
    // If the server could not load the notes from the cloud, an empty list would look
    // exactly like having no notes. The banner says what is actually wrong, and writes
    // are switched off because the server refuses them in that state.
    let writable = true;

    function applySync(sync) {
      const b = $("syncBanner");
      const state = sync && sync.state;
      writable = !sync || sync.writable !== false;
      $("uploadBtn").disabled = !writable;
      $("addCategoryBtn").disabled = !writable;
      document.querySelectorAll(
        "#notes button.edit, #notes button.del, #notes .cat-tools button, #notes select.move, .editor .save")
        .forEach(x => { x.disabled = !writable; });
      document.querySelectorAll("#notes .grip").forEach(g => { g.draggable = writable; });
      if (state === "unavailable") {
        b.className = "banner error";
        b.textContent = "無法載入你的雲端筆記庫：" + (sync.message || "原因不明")
          + "。為了避免覆蓋雲端上的筆記，目前暫停上傳、修改、刪除與問答。";
        b.hidden = false;
      } else if (state === "unsaved") {
        b.className = "banner warn";
        b.textContent = (sync.message || "最近的變更還沒有同步到雲端")
          + "。下一次上傳或修改時會自動重試。";
        b.hidden = false;
      } else if (state === "disabled") {
        b.className = "banner info";
        b.textContent = "本機模式：筆記不會同步到雲端。";
        b.hidden = false;
      } else {
        b.hidden = true;
      }
    }

    async function checkSync() {
      try {
        const res = await fetch(API_BASE + "/api/health");
        if (res.ok) applySync((await res.json()).sync);
      } catch (e) { /* server unreachable: requests will report their own errors */ }
    }

    // Pull a readable message from a JSON error body (detail may be a string, an
    // object/array, or absent) so we never render the useless "[object Object]".
    const errText = (data, res) => {
      const d = data && data.detail;
      if (typeof d === "string") return d;
      if (d != null) { try { return JSON.stringify(d); } catch (_) { return String(d); } }
      return "HTTP " + res.status;
    };

    // Model dropdown. The backend (/api/models) is the source of truth and validates
    // every request against the same allowlist, so this fallback list existing to keep
    // the UI usable when the backend is asleep can't cause an invalid model to be used
    // — an unknown id simply falls back to the server default.
    const FALLBACK_MODELS = [
      { id: "gemini-3.8-flash", label: "Gemini 3.8 Flash" },
      { id: "gemini-3.7-flash", label: "Gemini 3.7 Flash" },
      { id: "gemini-3.6-flash", label: "Gemini 3.6 Flash" },
      { id: "gemini-3.5-flash", label: "Gemini 3.5 Flash" },
      { id: "gemini-3.5-flash-lite", label: "Gemini 3.5 Flash Lite" },
      { id: "gemini-3.1-flash-lite", label: "Gemini 3.1 Flash Lite（預設）" },
      { id: "gemini-3-flash-preview", label: "Gemini 3 Flash（preview）" },
      { id: "gemini-2.5-flash", label: "Gemini 2.5 Flash" },
    ];

    function fillModels(models, def) {
      const sel = $("model");
      sel.innerHTML = "";
      for (const m of models) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.label || m.id;
        sel.appendChild(opt);
      }
      // Restore the last choice; fall back to the server's default.
      const saved = localStorage.getItem("nh_model");
      sel.value = models.some((m) => m.id === saved) ? saved : def;
      if (!sel.value && models.length) sel.value = models[0].id;
    }

    async function loadModels() {
      try {
        const res = await fetch(API_BASE + "/api/models");
        const data = await res.json();
        fillModels(data.models || FALLBACK_MODELS, data.default);
      } catch (e) {
        fillModels(FALLBACK_MODELS, "gemini-3.1-flash-lite");
      }
    }

    $("model").addEventListener("change", () => {
      localStorage.setItem("nh_model", $("model").value);
    });

    marked.setOptions({ breaks: true });
    const escapeHtml = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // Render text as Markdown (bold/italics/lists) + LaTeX, safely.
    // LaTeX spans are stashed before Markdown runs so things like $m_1$ aren't
    // mangled by Markdown's underscore/asterisk handling, then restored for MathJax.
    // `sources` (from /api/query) are stashed the same way — a file name such as
    // lv.0_compressed.pdf would otherwise be italicised — and come back as buttons.
    function renderRich(el, text, sources = []) {
      const math = [];
      const stash = (m) => "@@MATH" + (math.push(m) - 1) + "@@";
      // Collapse runs of blank lines so spacing is uniform, not "weird".
      let clean = (text || "").replace(/\r\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
      sources.forEach((s, i) => { clean = clean.split(s.marker).join("@@CITE" + i + "@@"); });
      const protectedText = clean
        .replace(/\$\$[\s\S]+?\$\$/g, stash)
        .replace(/\\\[[\s\S]+?\\\]/g, stash)
        .replace(/\\\([\s\S]+?\\\)/g, stash)
        .replace(/\$[^\n$]+?\$/g, stash);
      let html = DOMPurify.sanitize(marked.parse(protectedText));
      html = html.replace(/@@MATH(\d+)@@/g, (_, i) => escapeHtml(math[Number(i)]));
      html = html.replace(/@@CITE(\d+)@@/g, (_, i) => citeButton(sources[Number(i)], i));
      el.innerHTML = html;
      el.querySelectorAll("button.cite").forEach(b =>
        b.addEventListener("click", () => openSource(sources[Number(b.dataset.cite)])));
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
    }

    const sourceLabel = (s) => {
      const name = s.id.length > 24 ? s.id.slice(0, 22) + "…" : s.id;
      return s.page ? `${name} 第 ${s.page} 頁` : name;
    };

    function citeButton(s, i) {
      const title = s.page ? `開啟 ${s.id} 第 ${s.page} 頁` : `開啟 ${s.id}`;
      return `<button type="button" class="cite" data-cite="${i}" title="${escapeHtml(title)}">`
        + escapeHtml(sourceLabel(s)) + "</button>";
    }

    // The answer, its inline citations, and a line listing every source it used.
    function renderAnswer(el, data) {
      const sources = Array.isArray(data.sources) ? data.sources : [];
      renderRich(el, data.answer, sources);
      if (!sources.length && !data.dropped) return;
      const row = document.createElement("div");
      row.className = "sources";
      if (sources.length) {
        row.appendChild(Object.assign(document.createElement("span"), { textContent: "來源：" }));
        sources.forEach((s, i) => {
          const b = Object.assign(document.createElement("button"), {
            type: "button", className: "cite", textContent: sourceLabel(s),
            title: s.page ? `開啟 ${s.id} 第 ${s.page} 頁` : `開啟 ${s.id}`,
          });
          b.addEventListener("click", () => openSource(s));
          row.appendChild(b);
        });
      }
      if (data.dropped) {
        // Said out loud: a removed citation means the model named a page or file that
        // was not in what it was given, which is worth the user knowing.
        row.appendChild(Object.assign(document.createElement("p"), {
          className: "dropped",
          textContent: `已移除 ${data.dropped} 個對應不到筆記內容的出處標註。`,
        }));
      }
      el.appendChild(row);
    }

    // Open the note a citation points to, in the side-by-side editor, at the cited page.
    async function openSource(s) {
      if (!s) return;
      const find = () => [...document.querySelectorAll("#notes li[data-note-id]")]
        .find(li => li.dataset.noteId === s.id);
      let li = find();
      if (!li) { await loadNotes(); li = find(); }
      if (!li) { alert(`找不到筆記「${s.id}」，可能已被刪除。`); return; }
      const open = li.querySelector(".editor");
      if (open && open._jump) {
        open.scrollIntoView({ behavior: "smooth", block: "start" });
        open._jump(s.page);
        return;
      }
      const n = noteIndex.get(s.id) || {};
      await openEditor(li, s.id, n.has_original, n.type, s.page);
      const box = li.querySelector(".editor");
      if (box) box.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // Render a preview: inline Markdown (bold/italic/code) + LaTeX. Block-only syntax
    // is normalized first — headings -> bold, horizontal rules dropped, blank lines
    // collapsed — so it reads cleanly instead of showing raw "###" / "---".
    function renderInline(el, text) {
      const math = [];
      const stash = (m) => "@@MATH" + (math.push(m) - 1) + "@@";
      const t = (text || "")
        .replace(/^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/gm, "")       // drop --- / *** / ___ rules
        .replace(/^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$/gm, "**$1**")   // headings -> bold
        .replace(/\*\*\s*([^*\n]+?)\s*\*\*/g, "**$1**")           // trim spaces inside **bold**
        .replace(/\$\$[\s\S]+?\$\$/g, stash)
        .replace(/\\\[[\s\S]+?\\\]/g, stash)
        .replace(/\\\([\s\S]+?\\\)/g, stash)
        .replace(/\$[^\n$]+?\$/g, stash)
        .replace(/\n{2,}/g, "\n")                                 // collapse blank lines
        .replace(/\$[^$\n]*$/, "…")                               // drop a dangling, unclosed $…
        .trim();
      let html = DOMPurify.sanitize(marked.parseInline(t));
      html = html.replace(/@@MATH(\d+)@@/g, (_, i) => escapeHtml(math[Number(i)]));
      el.innerHTML = html;
      if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {});
    }

    // `state` is "", "pending" or "error": waiting and failing are styled apart from an answer.
    function setAnswer(text, state = "") {
      $("answer").className = state;
      $("answer").textContent = text;
    }

    async function ask() {
      const question = $("question").value.trim();
      if (!question) return;
      if (!userId()) { setAnswer("請先使用 Google 登入。", "error"); return; }
      $("askBtn").disabled = true;
      setAnswer("思考中…", "pending");
      try {
        const res = await api("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // No category means every category is searched; a chosen one is the only
          // folder the server opens.
          body: JSON.stringify({ question, top_k: 10, model: $("model").value,
                                 category: $("askCategory").value || null }),
        });
        const data = await res.json();
        if (res.ok) { $("answer").className = ""; renderAnswer($("answer"), data); }
        else { setAnswer("錯誤：" + errText(data, res), "error"); }
      } catch (e) {
        setAnswer("請求失敗：" + e, "error");
      } finally {
        $("askBtn").disabled = false;
      }
    }

    async function upload() {
      const file = $("file").files[0];
      if (!file) return;
      if (!userId()) { $("uploadResult").textContent = "請先使用 Google 登入再上傳。"; return; }
      $("uploadBtn").disabled = true;
      $("uploadResult").textContent = "上傳中…（圖片 / PDF 需呼叫 Gemini 產生描述，可能稍久）";
      const fd = new FormData();
      fd.append("file", file);
      fd.append("model", $("model").value);
      fd.append("category", $("uploadCategory").value);
      try {
        const res = await api("/api/upload", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) { $("uploadResult").textContent = "錯誤：" + errText(data, res); }
        else if (data.added === false) { $("uploadResult").textContent = data.id + " 已存在，跳過"; }
        else {
          // Say so on the upload itself when the note did not reach the cloud, instead
          // of letting the user find out after the server restarts.
          const unsynced = data.sync === "unsaved" ? "（注意：尚未同步到雲端）" : "";
          $("uploadResult").textContent = data.id + " 已加入" + unsynced
            + (data.description ? "（描述：" + data.description.slice(0, 60) + "…）" : "");
        }
        loadNotes();
      } catch (e) {
        $("uploadResult").textContent = "上傳失敗：" + e;
      } finally {
        $("uploadBtn").disabled = !writable;
        checkSync();
      }
    }

    // Full note text, shared by 展開更多 and 儲存 .md so opening one does not make the
    // other re-fetch. Cleared on every loadNotes(), which runs after an edit is saved,
    // so a stale copy can never be handed out.
    const noteTextCache = new Map();

    async function fetchNoteText(id) {
      if (noteTextCache.has(id)) return noteTextCache.get(id);
      const res = await api("/api/notes/" + encodeURIComponent(id));
      const data = await res.json();
      if (!res.ok) throw new Error(errText(data, res));
      noteTextCache.set(id, data.text);
      return data.text;
    }

    // Save the stored note as a .md file. The text is already Markdown — the extraction
    // prompts ask for it — so this is a straight download, no conversion. The note id
    // keeps its own name but swaps the source extension: 一下公民三段.pdf -> .md.
    function downloadMarkdown(id, text) {
      const name = id.replace(/\.[^.\/\\]+$/, "") + ".md";
      const url = URL.createObjectURL(new Blob([text], { type: "text/markdown;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return name;
    }

    // --- Categories --------------------------------------------------------------
    // Categories are flat and independent: each is its own folder on the server. The
    // list below shows one group per category (plus 未分類), and every group is a drop
    // target, so filing a note is a drag from one group to another.
    let categories = [];
    const noteIndex = new Map();     // note id -> list entry, for opening a cited note

    const showMessage = (el, text) => {
      el.innerHTML = "";
      el.appendChild(Object.assign(document.createElement("p"), { className: "muted", textContent: text }));
    };

    // Keep the two category pickers in step with the category list, holding on to the
    // current choice when it still exists.
    function fillCategorySelects() {
      const fill = (sel, firstLabel, remember) => {
        const keep = remember ? (localStorage.getItem(remember) || "") : sel.value;
        sel.innerHTML = "";
        sel.appendChild(new Option(firstLabel, ""));
        for (const c of categories) sel.appendChild(new Option(c.name, c.id));
        sel.value = categories.some(c => c.id === keep) ? keep : "";
      };
      fill($("askCategory"), "全部類別", "nh_ask_category");
      fill($("uploadCategory"), "未分類", null);
      updateScopeHint();
    }

    function updateScopeHint() {
      const c = categories.find(x => x.id === $("askCategory").value);
      $("askScopeHint").textContent = c
        ? `只會在「${c.name}」這個類別的筆記中尋找答案，不會讀取其他類別。`
        : "未選擇類別時，會在所有筆記中尋找答案。";
    }

    $("askCategory").addEventListener("change", () => {
      localStorage.setItem("nh_ask_category", $("askCategory").value);
      updateScopeHint();
    });

    async function jsonOrThrow(res) {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(errText(data, res));
      return data;
    }

    async function addCategory() {
      const input = $("newCategory");
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      if (!userId()) { alert("請先使用 Google 登入。"); return; }
      $("addCategoryBtn").disabled = true;
      try {
        await jsonOrThrow(await api("/api/categories", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        }));
        input.value = "";
        await loadNotes();
      } catch (e) {
        alert("新增類別失敗：" + e.message);
      } finally {
        $("addCategoryBtn").disabled = !writable;
        checkSync();
      }
    }

    async function renameCategory(c) {
      const name = prompt("新的類別名稱", c.name);
      if (name === null || name.trim() === "" || name.trim() === c.name) return;
      try {
        await jsonOrThrow(await api("/api/categories/" + encodeURIComponent(c.id), {
          method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        }));
        await loadNotes();
      } catch (e) {
        alert("重新命名失敗：" + e.message);
      } finally {
        checkSync();
      }
    }

    async function deleteCategory(c, count) {
      const what = count
        ? `其中的 ${count} 筆筆記會移到「未分類」，筆記本身不會被刪除。`
        : "這個類別目前沒有筆記。";
      if (!confirm(`確定要刪除類別「${c.name}」嗎？\n${what}`)) return;
      try {
        await jsonOrThrow(await api("/api/categories/" + encodeURIComponent(c.id), { method: "DELETE" }));
        await loadNotes();
      } catch (e) {
        alert("刪除類別失敗：" + e.message);
      } finally {
        checkSync();
      }
    }

    async function moveNote(id, category) {
      try {
        await jsonOrThrow(await api("/api/notes/" + encodeURIComponent(id) + "/move", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ category: category || null }),
        }));
      } catch (e) {
        alert("移動失敗：" + e.message);
      } finally {
        await loadNotes();
        checkSync();
      }
    }

    // A group of notes that accepts drops. `c` is null for 未分類.
    function categoryGroup(c, notes) {
      const group = document.createElement("div");
      group.className = "cat-group" + (c ? "" : " none");
      const head = document.createElement("div");
      head.className = "cat-head";
      head.appendChild(Object.assign(document.createElement("span"),
        { className: "cat-name", textContent: c ? c.name : "未分類" }));
      head.appendChild(Object.assign(document.createElement("span"),
        { className: "cat-count", textContent: notes.length + " 筆" }));
      if (c) {
        const tools = document.createElement("span");
        tools.className = "cat-tools";
        const rename = Object.assign(document.createElement("button"),
          { className: "toggle", textContent: "重新命名", disabled: !writable });
        rename.addEventListener("click", () => renameCategory(c));
        const del = Object.assign(document.createElement("button"),
          { className: "toggle danger", textContent: "刪除類別", disabled: !writable });
        del.addEventListener("click", () => deleteCategory(c, notes.length));
        tools.appendChild(rename);
        tools.appendChild(del);
        head.appendChild(tools);
      }
      group.appendChild(head);

      const ul = document.createElement("ul");
      ul.className = "cat-notes";
      if (notes.length === 0) {
        ul.appendChild(Object.assign(document.createElement("li"), {
          className: "empty",
          textContent: c ? "把筆記拖到這裡" : "拖到這裡可取消分類",
        }));
      }
      for (const n of notes) ul.appendChild(noteRow(n));
      group.appendChild(ul);

      // Drop target. The note id travels in dataTransfer; dropping onto the group it
      // already belongs to does nothing.
      const target = c ? c.id : "";
      group.addEventListener("dragover", (ev) => {
        if (!writable || !ev.dataTransfer.types.includes("text/x-note-id")) return;
        ev.preventDefault();
        ev.dataTransfer.dropEffect = "move";
        group.classList.add("drop");
      });
      group.addEventListener("dragleave", (ev) => {
        if (!group.contains(ev.relatedTarget)) group.classList.remove("drop");
      });
      group.addEventListener("drop", (ev) => {
        ev.preventDefault();
        group.classList.remove("drop");
        const id = ev.dataTransfer.getData("text/x-note-id");
        const from = ev.dataTransfer.getData("text/x-note-category");
        if (id && from !== target) moveNote(id, target);
      });
      return group;
    }

    async function loadNotes() {
      noteTextCache.clear();
      const box = $("notes");
      // Open editors hold blob: URLs for their originals; release them before the rows
      // they belong to are thrown away, or each one keeps a whole PDF in memory.
      box.querySelectorAll(".editor").forEach(e => e._release && e._release());
      if (!userId()) {
        categories = [];
        fillCategorySelects();
        showMessage(box, "請先使用 Google 登入");
        return;
      }
      let notes;
      try {
        const [resN, resC] = await Promise.all([api("/api/notes"), api("/api/categories")]);
        notes = await resN.json();
        const cats = await resC.json();
        if (!resN.ok) { showMessage(box, "載入筆記失敗：" + errText(notes, resN)); return; }
        if (!resC.ok) { showMessage(box, "載入類別失敗：" + errText(cats, resC)); return; }
        categories = Array.isArray(cats) ? cats : [];
      } catch (e) {
        showMessage(box, "載入筆記失敗，請稍後重試");
        return;
      }
      fillCategorySelects();
      box.innerHTML = "";
      if (!Array.isArray(notes)) notes = [];
      noteIndex.clear();
      for (const n of notes) noteIndex.set(n.id, n);
      if (notes.length === 0 && categories.length === 0) {
        // Not "no notes" when the store never loaded — that was the misleading message.
        showMessage(box, writable ? "（尚無筆記）"
          : "雲端筆記庫目前無法載入，所以這裡暫時看不到你的筆記。");
        return;
      }
      for (const c of categories) {
        box.appendChild(categoryGroup(c, notes.filter(n => n.category === c.id)));
      }
      const known = new Set(categories.map(c => c.id));
      box.appendChild(categoryGroup(null, notes.filter(n => !known.has(n.category))));
    }

    const GRIP_ICON = '<svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true" fill="currentColor">'
      + [3, 8, 13].map(y => `<circle cx="2" cy="${y}" r="1.3"/><circle cx="8" cy="${y}" r="1.3"/>`).join("")
      + "</svg>";
    const TYPE_LABEL = { text: "文字", image: "圖片", pdf: "PDF" };

    // One note row: drag handle, name and preview, actions.
    function noteRow(n) {
      const li = document.createElement("li");
      li.dataset.noteId = n.id;
      // The handle, not the whole row, is draggable: a draggable row would swallow text
      // selection inside an open editor.
      const grip = Object.assign(document.createElement("span"),
        { className: "grip", innerHTML: GRIP_ICON, title: "拖曳到其他類別", draggable: writable });
      grip.addEventListener("dragstart", (ev) => {
        ev.dataTransfer.setData("text/x-note-id", n.id);
        ev.dataTransfer.setData("text/x-note-category", n.category || "");
        ev.dataTransfer.effectAllowed = "move";
        ev.dataTransfer.setDragImage(li, 12, 12);
        li.classList.add("dragging");
      });
      grip.addEventListener("dragend", () => li.classList.remove("dragging"));
      li.appendChild(grip);
      const meta = document.createElement("span");
      meta.className = "meta";
      const tag = Object.assign(document.createElement("span"),
        { className: "note-type", textContent: TYPE_LABEL[n.type] || n.type });
      const name = Object.assign(document.createElement("span"),
        { className: "note-name", textContent: n.id });
      const preview = document.createElement("span");
      preview.className = "note-preview";
      renderInline(preview, n.preview);
      meta.appendChild(tag);
      meta.appendChild(name);
      meta.appendChild(preview);
      const actions = document.createElement("div");
      actions.className = "note-actions";
      const edit = document.createElement("button");
      edit.className = "edit";
      edit.disabled = !writable;
      edit.textContent = "編輯";
      edit.addEventListener("click", () => openEditor(li, n.id, n.has_original, n.type));
      // The list preview is capped at 240 chars server-side, so a 23-page PDF showed
      // almost nothing of what was actually stored. This expands the whole thing in
      // place, without making the user open the editor to read their own note.
      const more = document.createElement("button");
      more.className = "toggle";
      more.textContent = "展開更多";
      let fullBox = null;
      more.addEventListener("click", async () => {
        if (fullBox) {                       // already fetched — just toggle
          const showing = !fullBox.hidden;
          fullBox.hidden = showing;
          more.textContent = showing ? "展開更多" : "顯示較少";
          return;
        }
        more.disabled = true;
        more.textContent = "載入中…";
        try {
          const text = await fetchNoteText(n.id);
          fullBox = document.createElement("div");
          fullBox.className = "full";
          renderRich(fullBox, text);
          li.appendChild(fullBox);
          more.textContent = "顯示較少";
        } catch (e) {
          more.textContent = "展開更多";
          alert("載入完整內容失敗：" + e.message);
        } finally {
          more.disabled = false;
        }
      });

      // Save the note as a .md file the user can keep, open in any editor, or hand to
      // another tool. The stored text is fetched rather than the 240-char preview.
      const dl = document.createElement("button");
      dl.className = "toggle";
      dl.textContent = "儲存 .md";
      dl.addEventListener("click", async () => {
        const label = dl.textContent;
        dl.disabled = true;
        dl.textContent = "準備中…";
        try {
          downloadMarkdown(n.id, await fetchNoteText(n.id));
          dl.textContent = "已儲存";
          setTimeout(() => { dl.textContent = label; }, 1500);
        } catch (e) {
          dl.textContent = label;
          alert("儲存失敗：" + e.message);
        } finally {
          dl.disabled = false;
        }
      });
      const del = document.createElement("button");
      del.className = "del";
      del.disabled = !writable;
      del.textContent = "刪除";
      del.addEventListener("click", () => deleteNote(n.id));
      // Same move as dragging, for touch screens where HTML drag and drop does not work.
      const move = document.createElement("select");
      move.className = "move";
      move.title = "移到其他類別";
      move.disabled = !writable;
      move.appendChild(new Option("未分類", ""));
      for (const c of categories) move.appendChild(new Option(c.name, c.id));
      move.value = n.category || "";
      move.addEventListener("change", () => moveNote(n.id, move.value));
      actions.appendChild(move);
      actions.appendChild(more);
      actions.appendChild(dl);
      actions.appendChild(edit);
      actions.appendChild(del);
      li.appendChild(meta);
      li.appendChild(actions);
      return li;
    }

    // Editing the extracted text. Gemini's transcription of a handwritten note is a
    // guess; letting the user correct it once fixes every future answer, and costs no
    // API call — saving only re-chunks and re-embeds.
    // A PDF viewer built from TWO stacked iframes.
    //
    // The embedded viewer only honours #page= on a fresh navigation, so jumping pages
    // means reloading — and reloading the single visible frame blanks it white while the
    // file re-parses, which is exactly the flicker this replaces. So the new page is
    // loaded in the hidden frame while the old one stays on screen, and they swap only
    // once it has finished. The visible frame therefore never goes blank.
    //
    // Both frames request the same URL, which the endpoint marks cacheable, so the swap
    // costs no extra download.
    function framePdf(src, id) {
      const wrap = document.createElement("div");
      wrap.className = "pdfwrap";
      let current = null;
      let gen = 0;

      // A FRESH iframe per jump, rather than re-pointing one.
      //
      // Reusing a frame was subtly broken in two ways, both of which showed as a blank
      // pane. Clearing src first made the frame navigate to about:blank, and *that*
      // fires `load` too — so a once-listener sometimes caught the blank navigation,
      // promoted an empty frame to the front, and then had nothing left to fire when the
      // PDF itself arrived. Skipping the clear was no better: going from #page=3 to
      // #page=12 on a loaded frame is a same-document fragment change, so no load event
      // ever came and the swap silently never happened.
      //
      // A brand new frame always performs a real navigation and fires exactly one load,
      // for the document we asked for. The outgoing frame is removed only after the
      // incoming one is on screen, so the pane is never empty.
      function goto(n) {
        const mine = ++gen;
        const next = document.createElement("iframe");
        next.title = id;
        next.addEventListener("load", () => {
          if (mine !== gen) { next.remove(); return; }   // a later click superseded this
          // The plugin paints shortly after `load`; reveal on the next beat so the
          // incoming frame is never shown mid-paint.
          setTimeout(() => {
            if (mine !== gen) { next.remove(); return; }
            next.classList.add("front");
            if (current && current !== next) current.remove();
            current = next;
          }, 250);
        }, { once: true });
        wrap.appendChild(next);
        next.src = n ? src + "#page=" + n : src;
      }
      goto(null);                                   // initial view, page 1
      return { wrap, goto };
    }

    // The original file, rendered next to the extracted text.
    //
    // It is fetched with the sign-in token and handed to the <img>/<iframe> as a blob:
    // URL. Those elements cannot send an Authorization header, and putting the token or
    // the email in their src would leak it into history and server logs. A side benefit:
    // the PDF is downloaded once per editor, so jumping pages never re-fetches it.
    //
    // Returns `goto(page)` for PDFs. Jumps requested before the file has arrived are
    // remembered and applied once it does. `release()` frees the blob.
    function originalPane(id, type) {
      const pane = document.createElement("div");
      pane.className = "original";
      const label = document.createElement("p");
      label.className = "pane-label";
      label.textContent = "原始筆記（載入中…）";
      pane.appendChild(label);

      let blobUrl = null, viewer = null, pendingPage = null;
      const goto = type === "pdf"
        ? (n) => { if (viewer) viewer.goto(n); else pendingPage = n; }
        : null;

      (async () => {
        try {
          const res = await api("/api/notes/" + encodeURIComponent(id) + "/original");
          if (!res.ok) {
            let detail = "";
            try { detail = errText(await res.json(), res); } catch (e) { detail = String(res.status); }
            throw new Error(detail);
          }
          blobUrl = URL.createObjectURL(await res.blob());
          label.textContent = "原始筆記";
          if (type === "pdf") {
            viewer = framePdf(blobUrl, id);
            pane.appendChild(viewer.wrap);
            if (pendingPage) viewer.goto(pendingPage);
          } else {
            const img = document.createElement("img");
            img.src = blobUrl;
            img.alt = id;
            img.addEventListener("error", () => {
              img.remove();
              label.textContent = "原始檔無法顯示";
            });
            pane.appendChild(img);
          }
        } catch (e) {
          label.textContent = "原始檔載入失敗：" + e.message;
        }
      })();

      const release = () => { if (blobUrl) URL.revokeObjectURL(blobUrl); blobUrl = null; };
      return { pane, goto, release };
    }

    // PDF extractions carry "## 第 N 頁" section markers (describe_pdf writes them).
    // Turning them into buttons lets the user step through a 23-page scan with the
    // transcription and the page it came from staying in sync.
    function pageJumper(text, goto, ta) {
      const pages = [...text.matchAll(/^##\s*第\s*(\d+)\s*頁/gm)];
      if (!goto || pages.length < 2) return null;
      const bar = document.createElement("div");
      bar.className = "pages";
      for (const m of pages) {
        const n = m[1];
        const b = document.createElement("button");
        b.textContent = n;
        b.dataset.page = n;
        b.addEventListener("click", () => {
          goto(Number(n));
          scrollToPage(ta, n);
          bar.querySelectorAll("button").forEach(x => x.classList.remove("on"));
          b.classList.add("on");
        });
        bar.appendChild(b);
      }
      return bar;
    }

    // Put the caret on a page's "## 第 N 頁" heading in the text box. Returns false when the
    // text has no such heading (a text or image note).
    function scrollToPage(ta, page) {
      const m = new RegExp("^##\\s*第\\s*" + Number(page) + "\\s*頁", "m").exec(ta.value);
      if (!m) return false;
      ta.focus();
      ta.setSelectionRange(m.index, m.index);
      // Approximate scroll — textarea has no per-line geometry to query.
      ta.scrollTop = ta.scrollHeight * (m.index / Math.max(ta.value.length, 1));
      return true;
    }

    // `page` opens the editor already at that page (used when following a citation).
    async function openEditor(li, id, hasOriginal, type, page = null) {
      if (li.querySelector(".editor")) return;   // already open
      const box = document.createElement("div");
      box.className = "editor";
      box.innerHTML = "<p class='muted'>載入中…</p>";
      li.appendChild(box);
      let text;
      try {
        const res = await api("/api/notes/" + encodeURIComponent(id));
        const data = await res.json();
        if (!res.ok) throw new Error(errText(data, res));
        text = data.text;
      } catch (e) {
        box.innerHTML = "";
        box.appendChild(Object.assign(document.createElement("p"),
          { className: "muted", textContent: "載入失敗：" + e.message }));
        return;
      }
      box.innerHTML = "";
      const ta = document.createElement("textarea");
      ta.value = text;
      const right = document.createElement("div");
      right.style.minWidth = "0";
      const rightLabel = document.createElement("p");
      rightLabel.className = "pane-label";
      rightLabel.textContent = "模型讀到的內容（可修改）";

      // Rendered preview of the box below it. The stored text is Markdown + LaTeX;
      // a student fixing a misread digit should be able to check the result without
      // reading `$\dfrac{...}$` — they compare this against the original on the left.
      const pvBar = document.createElement("div");
      pvBar.className = "preview-bar";
      const pvLabel = document.createElement("p");
      pvLabel.className = "pane-label";
      pvLabel.textContent = "顯示結果";
      const pvToggle = document.createElement("button");
      pvToggle.className = "toggle";
      pvToggle.textContent = "隱藏";
      const pv = document.createElement("div");
      pv.className = "preview";
      let pvTimer = null;
      const refreshPreview = () => renderRich(pv, ta.value);
      pvToggle.addEventListener("click", () => {
        const hidden = pv.hidden;
        pv.hidden = !hidden;
        pvToggle.textContent = hidden ? "隱藏" : "顯示";
        if (hidden) refreshPreview();
      });
      // Debounced: MathJax typesetting on every keystroke would fight the typist.
      ta.addEventListener("input", () => {
        clearTimeout(pvTimer);
        if (!pv.hidden) pvTimer = setTimeout(refreshPreview, 400);
      });
      pvBar.appendChild(pvLabel);
      pvBar.appendChild(pvToggle);
      const save = document.createElement("button");
      save.className = "save";
      save.textContent = "儲存";
      save.disabled = !writable;
      const cancel = document.createElement("button");
      cancel.className = "edit";
      cancel.textContent = "取消";
      cancel.style.marginLeft = ".5rem";
      const hint = document.createElement("p");
      hint.className = "muted hint";
      hint.textContent = hasOriginal
        ? "左邊是你的原稿，中間的框是模型讀到的內容，下方「顯示結果」會即時呈現排版後的樣子——不需要看懂 $ 符號，直接對照原稿改字即可。改完儲存，之後的回答就會使用更正後的內容。"
        : "在框中修正辨識錯誤，下方「顯示結果」會即時呈現排版後的樣子。改完儲存，之後的回答就會使用更正後的內容。";
      save.addEventListener("click", async () => {
        save.disabled = true;
        hint.textContent = "儲存中…";
        try {
          const res = await api("/api/notes/" + encodeURIComponent(id), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: ta.value }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(errText(data, res));
          closeEditor();
          loadNotes();
          checkSync();
        } catch (e) {
          hint.textContent = "儲存失敗：" + e.message;
          save.disabled = false;
        }
      });
      // Closing an editor frees the original's blob URL, which can hold a whole PDF.
      const closeEditor = () => { if (box._release) box._release(); box.remove(); };
      cancel.addEventListener("click", closeEditor);
      right.appendChild(rightLabel);
      right.appendChild(ta);
      right.appendChild(pvBar);
      right.appendChild(pv);
      refreshPreview();
      right.appendChild(save);
      right.appendChild(cancel);
      right.appendChild(hint);
      if (hasOriginal) {
        box.classList.add("split");
        const { pane, goto, release } = originalPane(id, type);
        box._release = release;
        const bar = pageJumper(text, goto, ta);
        if (bar) pane.appendChild(bar);
        box.appendChild(pane);   // left
        box._goto = goto;
      } else if (type === "text") {
        const note = document.createElement("p");
        note.className = "muted pane-label";
        note.textContent = "純文字筆記沒有原始檔可對照。";
        right.insertBefore(note, save);
      }
      box.appendChild(right);
      // Jump to a cited page: through the page buttons when there are some (they move the
      // PDF and the text together), otherwise the PDF and the text box directly.
      box._jump = (p) => {
        if (!p) return;
        const b = box.querySelector(`.pages button[data-page="${Number(p)}"]`);
        if (b) { b.click(); return; }
        if (box._goto) box._goto(Number(p));
        scrollToPage(ta, p);
      };
      if (page) box._jump(page);
    }

    async function deleteNote(id) {
      if (!confirm(`確定要刪除「${id}」嗎？\n此動作無法復原。`)) return;
      try {
        const res = await api("/api/notes/" + encodeURIComponent(id), { method: "DELETE" });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert("刪除失敗：" + errText(data, res));
          return;
        }
        loadNotes();
      } catch (e) {
        alert("刪除失敗：" + e);
      } finally {
        checkSync();
      }
    }

    // === Google 登入 (Google Identity Services) ===
    // 設定步驟：
    //   1. 到 https://console.cloud.google.com/ 建立 OAuth 2.0 用戶端 ID（網頁應用程式）。
    //   2. 在「已授權的 JavaScript 來源」加入此頁網址（例如 http://localhost:8000）。
    //   3. 把產生的用戶端 ID 貼到下面的 GOOGLE_CLIENT_ID。
    const GOOGLE_CLIENT_ID = "1068367879973-ps73rd0aoqr4u03cri4vomho72mh4qkm.apps.googleusercontent.com";

    // 解碼 Google ID token (JWT) 的 payload，取出 email / name（純前端，不需後端）。
    function decodeJwt(token) {
      const part = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      const json = decodeURIComponent(
        atob(part).split("").map((c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join("")
      );
      return JSON.parse(json);
    }

    // Updates the status line without wiping the 登出 link that lives inside it.
    function setStatus(text) { $("googleStatus").firstChild.textContent = text; }

    // 設定目前使用者並更新畫面（登入成功或從上次登入還原時共用）。
    function setUser(label) {
      setStatus(label);
      $("signoutLink").style.display = "";
      setAnswer("");
      $("uploadResult").textContent = "";
      loadNotes();
    }

    // 登入成功：保存 Google 回傳的 ID token（不是只存 email）。之後每個請求都帶上它，
    // 由伺服器驗證簽章與到期時間，才認定你是誰。
    function handleGoogleCredential(response) {
      const info = tokenClaims(response.credential);
      if (!info || !info.email) {
        setStatus("Google 登入失敗，請再試一次。");
        return;
      }
      idToken = response.credential;
      localStorage.setItem(TOKEN_KEY, idToken);
      setUser("已連結：" + info.email + (info.name ? "（" + info.name + "）" : ""));
    }

    // Token expired or rejected by the server. Say so, clear the list, and offer Google's
    // one-tap prompt so a returning user can get back in without hunting for the button.
    function signedOut(message) {
      idToken = null;
      localStorage.removeItem(TOKEN_KEY);
      $("signoutLink").style.display = "none";
      setStatus(message);
      showMessage($("notes"), "請先使用 Google 登入");
      if (window.google && google.accounts && google.accounts.id) google.accounts.id.prompt();
    }

    $("signoutLink").addEventListener("click", (ev) => {
      ev.preventDefault();
      localStorage.removeItem(TOKEN_KEY);
      if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      location.reload();
    });

    // Restore the previous sign-in only while its token is still valid (Google ID tokens
    // last about an hour). "nh_user" held a bare email under the old scheme and no longer
    // signs anyone in, so it is removed rather than trusted.
    localStorage.removeItem("nh_user");
    const savedToken = localStorage.getItem(TOKEN_KEY);
    const restored = tokenUsable(savedToken);
    if (restored) {
      idToken = savedToken;
    } else if (savedToken) {
      localStorage.removeItem(TOKEN_KEY);
      setStatus("上次的登入已過期，請重新登入。");
    }

    function initGoogle() {
      if (!(window.google && google.accounts && google.accounts.id)) return;
      if (GOOGLE_CLIENT_ID.startsWith("YOUR_")) {
        setStatus("尚未設定 Google 用戶端 ID（請見 index.html 中的 GOOGLE_CLIENT_ID）。");
        return;
      }
      // auto_select lets a returning user be signed straight back in once their token
      // has expired, provided they have signed in to this app before.
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential,
                                      auto_select: true });
      google.accounts.id.renderButton($("gsiButton"), { theme: "outline", size: "large", text: "signin_with", shape: "pill" });
      if (!idToken && !DEV_USER) google.accounts.id.prompt();
    }
    window.addEventListener("load", initGoogle);

    $("askBtn").addEventListener("click", ask);
    $("uploadBtn").addEventListener("click", upload);
    $("refreshBtn").addEventListener("click", loadNotes);
    $("addCategoryBtn").addEventListener("click", addCategory);
    $("newCategory").addEventListener("keydown", (ev) => { if (ev.key === "Enter") addCategory(); });
    loadModels();

    // Sync state first: it decides whether an empty list means "no notes" or "could not
    // load them", and whether the write buttons are usable.
    (async () => {
      await checkSync();
      if (restored) {
        setUser("已連結（上次登入）：" + tokenClaims(idToken).email);
      } else if (DEV_USER) {
        setUser("本機開發模式：" + DEV_USER);
      } else {
        loadNotes();
      }
    })();
  </script>
</body>
</html>
